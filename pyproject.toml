[project]
name = "optimizer"
version = "1.0.0"
description = "Local Device Optimizer — find out why your PC is slow and safely pause what you don't need."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build", "dist", ".venv", ".venv-build", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Embedded SVG markup lines; wrapping them hurts readability.
"scripts/make_social_preview.py" = ["E501"]
